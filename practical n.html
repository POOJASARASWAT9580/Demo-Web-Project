<!DOCTYPE html>
<html>
<head>
<title>Navigation Menu</title>
<style>
body{
  font-family: Arial;
  text-align: center;
}

/* Common style */
ul{
  list-style: none;
  padding: 0;
}
a{
  text-decoration: none;
  color: white;
  padding: 10px 15px;
}

/* Block */
.block li a{
  display: block;
  background: black;
  margin: 5px 0;
}

/* Inline */
.inline li{
  display: inline;
}
.inline a{
  background: green;
}

/* Inline-block */
.inline-block li{
  display: inline-block;
}
.inline-block a{
  background: purple;
}

/* Float */
.float li{
  float: left;
  margin-right: 10px;
}
.float a{
  background: orange;
}
.clear{
  clear: both;
}
</style>
</head>

<body>

<h2>Block Menu</h2>
<ul class="block">
  <li><a href="#">Home</a></li>
  <li><a href="#">About</a></li>
  <li><a href="#">Contact</a></li>
</ul>

<h2>Inline Menu</h2>
<ul class="inline">
  <li><a href="#">Home</a></li>
  <li><a href="#">About</a></li>
  <li><a href="#">Contact</a></li>
</ul>

<h2>Inline-Block Menu</h2>
<ul class="inline-block">
  <li><a href="#">Home</a></li>
  <li><a href="#">About</a></li>
  <li><a href="#">Contact</a></li>
</ul>

<h2>Float Menu</h2>
<ul class="float">
  <li><a href="#">Home</a></li>
  <li><a href="#">About</a></li>
  <li><a href="#">Contact</a></li>
</ul>

<div class="clear"></div>

</body>
</html>
